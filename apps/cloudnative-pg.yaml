apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "0.29.0"          # PIN: run `make chart-versions`
      helm:
        valueFiles:
          - $values/values/cloudnative-pg.yaml
    - repoURL: https://github.com/soolame/deepdive-gitops
      targetRevision: main
      ref: values                   # what $values resolves to
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # CRD-heavy charts need this
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
