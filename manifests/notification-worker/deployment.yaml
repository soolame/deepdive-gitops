apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: soolame7/deepdive-notification-worker:34687d6823a50b8b8993fd7550689a0b954454cc
          envFrom:
            - configMapRef:
                name: notification-worker-config
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
