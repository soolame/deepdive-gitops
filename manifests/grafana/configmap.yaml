# Datasources (Prometheus/Loki/Tempo) and dashboards get provisioned here
# later via mounted ConfigMaps under /etc/grafana/provisioning - that's
# curriculum, written by hand, not scaffolded.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "admin"
