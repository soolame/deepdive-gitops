# CloudNativePG Cluster CR. The operator turns this into StatefulSets,
# Services, PVCs, and a metrics endpoint.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1                      # bump to 3 later to watch a real failover
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  storage:
    size: 2Gi
    storageClass: standard

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 384Mi }

  bootstrap:
    initdb:
      database: orders
      owner: app
      # Secret must be type kubernetes.io/basic-auth with username+password.
      # Created by `make secrets`, never committed.
      secret:
        name: postgres-credentials
      # Runs against the `postgres` database as superuser.
      postInitSQL:
        - CREATE DATABASE inventory OWNER app;

  monitoring:
    # Flip to true in Phase 2 once prometheus-operator CRDs exist.
    enablePodMonitor: false
