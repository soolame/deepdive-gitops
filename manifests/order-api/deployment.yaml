# Image tag is bumped automatically by deepdive-services' CI on every push
# to main - see .github/workflows/build-deploy.yml over there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: soolame7/deepdive-order-api:2aa8b318a472e0309c0a5286e1978fdfee00a840
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: order-api-config
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
